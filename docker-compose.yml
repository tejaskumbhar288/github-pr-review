# The full roadmap-2/3 topology: webhook receiver, async worker, and the Redis
# that keeps them idempotent. `docker compose up` is the whole deployment.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.server.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # Scale horizontally; the (pr, head_sha) reservation keeps two workers from
    # reviewing the same commit.
    deploy:
      replicas: 1

volumes:
  redis-data:
