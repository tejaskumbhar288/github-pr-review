# The full roadmap-2/3 topology: webhook receiver, async worker, and the Redis
# that keeps them idempotent. `docker compose up` is the whole deployment.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # env_file hands over the *host* path to the app's private key, which does
      # not exist in here. Point at the mount instead; `environment` wins over
      # `env_file`, so .env stays correct for running outside a container.
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      # A directory, not the file: bind-mounting a file that may not exist fails
      # the whole service, and the app is optional.
      - ./secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.server.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # env_file hands over the *host* path to the app's private key, which does
      # not exist in here. Point at the mount instead; `environment` wins over
      # `env_file`, so .env stays correct for running outside a container.
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      # A directory, not the file: bind-mounting a file that may not exist fails
      # the whole service, and the app is optional.
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    # Scale horizontally; the (pr, head_sha) reservation keeps two workers from
    # reviewing the same commit.
    deploy:
      replicas: 1

volumes:
  redis-data:
